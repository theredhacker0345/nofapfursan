apply plugin: 'com.android.application'

// Load keystore properties if available (for release signing)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version comes from package.json so the APK, the web build and the in-app
// "Fursan 2.5.0" label can never disagree. They were three hard-coded copies.
def pkg = new groovy.json.JsonSlurper().parseText(
    rootProject.file("../package.json").getText("UTF-8")
)
def pkgVersion = pkg.version as String
def [pkgMajor, pkgMinor, pkgPatch] = pkgVersion.split("[-.]").collect { it as Integer }
// Android requires a monotonically increasing integer code; patch releases that
// do not need a new APK keep the previous code.
def pkgVersionCode = (pkgMajor * 10000) + (pkgMinor * 100) + pkgPatch

android {
    namespace = "com.nofapfursan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nofapfursan.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkgVersionCode
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Signing configuration for release builds
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // `file()` resolves against this module's directory (android/app),
                // so the "app/" prefix here resolved to android/app/app/... while
                // CI writes the keystore to android/app/release-keystore.jks.
                // The signed release build failed at this line.
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                throw new GradleException(
                    "android/keystore.properties is missing. Release signing cannot " +
                    "be configured; copy the four keys from your CI secrets. " +
                    "Refusing to produce an unsigned APK that looks signed."
                )
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            // Use release signing if keystore is available
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }


}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core-ktx:$androidxCoreVersion"
        force "androidx.activity:activity:$androidxActivityVersion"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

