name: Android debug build

# A cheap sanity build that the Android project still compiles. Debug APKs are
# produced on demand (workflow_dispatch) or for a tag, not on every push — the
# previous version built one on every commit to main, which cost ~15 minutes of
# CI for an artifact nobody downloaded.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Capacitor sync + Gradle compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify, lint and build the web bundle
        run: npm run verify

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fursan-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14