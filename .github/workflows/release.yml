name: Build and release signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  build-and-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify, lint and build the web bundle
        run: npm run verify

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Capacitor sync
        run: npx cap sync android

      # The previous version ran `assembleRelease` unconditionally while writing
      # the keystore behind `if: env.X != ''`, so a repository without the
      # secrets failed deep inside Gradle with an opaque error. Check up front.
      - name: Check signing secrets are present
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=0
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it in Settings → Secrets, then re-run the tag."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/app/release-keystore.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties << EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename and checksum
        id: artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          [ -n "$version" ] || version="${{ inputs.tag }}"
          src=android/app/build/outputs/apk/release/app-release.apk
          dst="android/app/build/outputs/apk/release/Fursan-${version}.apk"
          mv "$src" "$dst"
          sha="$(sha256sum "$dst" | cut -d ' ' -f 1)"
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "PATH=$dst" >> $GITHUB_OUTPUT
          echo "SHA256=$sha" >> $GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Fursan ${{ steps.artifact.outputs.VERSION }}
          body: |
            ## Fursan ${{ steps.artifact.outputs.VERSION }}

            Privacy-first, decentralized streak tracking. Your records live on your
            device; the encrypted backup syncs through the Nostr network.

            **SHA-256** — `${{ steps.artifact.outputs.SHA256 }}`

            Install the APK below, allow installation from unknown sources once, and
            open it. Nothing is uploaded to a server.
          prerelease: ${{ contains(steps.artifact.outputs.VERSION, '-') }}
          files: ${{ steps.artifact.outputs.PATH }}
          fail_on_unmatched_files: true